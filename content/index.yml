faq:
  title: Häufige Fragen
  description: Antworten auf die Fragen, die uns am häufigsten zu POx gestellt werden.
  categories:
    - title: Technologie & Material
      questions:
        - label: Was sind Poly(2-oxazolin)e (POx)?
          content: |
            POx sind eine Klasse synthetischer Polymere, die durch kationische ringöffnende Polymerisation von 2-Oxazolinen entstehen. Weil die Polymerisation lebend verläuft, lassen sich Kettenlänge und Endgruppen präzise steuern. Das Ergebnis ist keine einzelne Substanz, sondern eine modulare Materialplattform, die sich für sehr unterschiedliche Anforderungen maßschneidern lässt.
        - label: Worin liegt der Vorteil gegenüber PEG?
          content: |
            PEG hat sich über Jahrzehnte bewährt, zeigt jedoch zunehmend Grenzen: Insbesondere im Zusammenhang mit Antikörpern und anderen Biologika kann PEG unerwünschte Immunreaktionen auslösen, die die Wirksamkeit von Therapien einschränken können. POx bietet demgegenüber eine bessere Biokompatibilität, eine größere Vielfalt an funktionellen chemischen Gruppen für gezielte Anpassungen sowie eine verbesserte Löslichkeit.
        - label: Für welche Anwendungen eignen sich POx?
          content: |
            Die Einsatzfelder reichen vom Medikamententransport über die Wirkstoffformulierung und die Stabilisierung von Lipid-Nanopartikeln bis zur Oberflächenmodifikation und zu kosmetischen Formulierungen. Einen ausführlichen Überblick mit Literaturangaben finden Sie auf unserer Seite [Materialien](/materialien).
    - title: Bestellung & Muster
      questions:
        - label: Kann ich Muster für eigene Tests erhalten?
          content: |
            Ja. Seit 2025 liefern wir Proben an Kooperationspartner aus, die POx in realen Anwendungsszenarien erproben – den Anfang machte unser Partner DermaPurge. Wenn Sie POx in Ihrer eigenen Formulierung testen möchten, sprechen Sie uns an.
        - label: Wie bestelle ich POx bei Oxaphil?
          content: |
            Eine Übersicht unseres Produkts mit den zugehörigen Spezifikationen finden Sie auf der Seite [Bestellen](/bestellung). Für ein konkretes Angebot wenden Sie sich direkt an unseren Ansprechpartner – wir klären Menge, Spezifikation und Lieferzeitpunkt individuell mit Ihnen.
        - label: In welchen Mengen ist POx verfügbar?
          content: |
            Nach Jahren der Forschung ist es uns gelungen, POx auch im industriellen Maßstab herzustellen. Damit sind sowohl kleine Mengen für erste Versuche als auch größere Liefermengen möglich. Die für Ihr Vorhaben passende Menge stimmen wir gern persönlich ab.
        - label: Beraten Sie auch bei der Formulierung?
          content: |
            Ja. Aus den Gesprächen auf Fachmessen wie der in-cosmetics Global und dem Drug Delivery & Formulation Summit wissen wir, wie unterschiedlich die Anforderungen an neue Materialien sind. Wir hören zu, verstehen Ihren Bedarf und entwickeln gemeinsam mit Ihnen eine passende Lösung.
    - title: Über Oxaphil
      questions:
        - label: Wer steht hinter Oxaphil?
          content: |
            Unser Team vereint Expertise aus Chemie, Regulatorik, Produktentwicklung und Unternehmensführung. Wissenschaftliche Exzellenz trifft dabei auf den Willen, neue Materialien tatsächlich in die Anwendung zu bringen. Die einzelnen Köpfe und ihre Verantwortungsbereiche stellen wir auf der Seite [Über uns](/wir) vor.
        - label: Wie ist Oxaphil entstanden?
          content: |
            Oxaphil ist aus der Forschung heraus entstanden und wird durch das EXIST-Programm gefördert; die Anbindung an die TU Dresden bildet dabei ein tragfähiges wissenschaftliches Fundament. Was uns antreibt, ist der Schritt vom Labor in die Anwendung – neuartige Materialien nicht nur denkbar, sondern anwendbar zu machen.
