title: Die Technologie hinter Oxaphil
description: Warum wir auf Poly(2-oxazolin)e statt auf PEG setzen.
content: |
  Kunststoffe und Polymere umgeben uns überall – in Verpackungen, Medizinprodukten und unzähligen Alltagsgegenständen. Auch in der Medizin und Pharmazie spielen Polymere eine zentrale Rolle, etwa als Löslichkeitsvermittler für Wirkstoffe. Der heute am weitesten verbreitete Vertreter ist Polyethylenglykol (PEG). PEG hat sich über Jahrzehnte bewährt, zeigt jedoch zunehmend Grenzen: Insbesondere im Zusammenhang mit Antikörpern und anderen Biologika kann PEG unerwünschte Immunreaktionen auslösen, welche die Wirksamkeit von Therapien einschränken können.

  Oxaphil setzt genau hier an: Wir entwickeln und produzieren Poly(2-oxazolin)e (POx) als leistungsfähige Alternative zu PEG. POx bietet eine bessere Biokompatibilität, eine größere Vielfalt an funktionellen chemischen Gruppen für gezielte Anpassungen sowie eine verbesserte Löslichkeit. Nach Jahren der Forschung ist es uns gelungen, POx nun auch im industriellen Maßstab herzustellen – ein entscheidender Schritt, um diese Materialklasse breit verfügbar zu machen.
