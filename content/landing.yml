valueProps:
  title: Warum POx
  description: Was Poly(2-oxazolin)e gegenüber PEG auszeichnet.
  items:
    - title: Bessere Biokompatibilität
      description: POx zeigt im Vergleich zu PEG ein deutlich geringeres Risiko unerwünschter Immunreaktionen – ein entscheidender Vorteil bei Biologika.
      icon: i-lucide-heart-pulse
    - title: Chemische Vielfalt
      description: Über die Seitenketten lassen sich Löslichkeit, Ladung und Funktionalität gezielt einstellen – ein Baukasten statt eines einzelnen Materials.
      icon: i-lucide-flask-conical
    - title: Industriell verfügbar
      description: Nach Jahren der Forschung stellen wir POx im industriellen Maßstab her und machen die Materialklasse damit breit zugänglich.
      icon: i-lucide-factory
