platform:
  title: POx als Plattform
  description: Poly(2-oxazolin)e sind kein einzelnes Material, sondern ein modularer Baukasten.
  image:
    src: /img/materialien-schema.png
    alt: Chemisches Schema von POx als Materialplattform
  content: |
    Poly(2-oxazolin)e entstehen durch kationische ringöffnende Polymerisation von 2-Oxazolinen. Das Verfahren ist lebend, das heißt Kettenlänge und Endgruppen lassen sich präzise steuern. Daraus ergibt sich eine Materialplattform, die sich für sehr unterschiedliche Anforderungen maßschneidern lässt.

