title: Häufige Fragen zur Bestellung
description: Antworten auf häufige Fragen rund um den Bestellprozess bei Oxaphil.
faqs:
  - label: Wie kann ich POx-Materialien bestellen?
    content: |
      Schreiben Sie uns einfach an <order@oxaphil.com> oder nutzen Sie das Anfrageformular weiter oben auf dieser Seite. Wir bestätigen Ihre Anfrage, prüfen die bei uns verfügbaren Mengen und Spezifikationen und senden Ihnen ein Angebot zu – inklusive der passenden Referenzmengen und Staffelpreise.
  - label: In welchen Mengen und Verpackungen liefern Sie?
    content: |
      Für funktionalisierte Materialien (Preisstufe „func“) liefern wir typischerweise in Staffelmengen ab 100 mg, 1 g, 5 g und 25 g. Unfunktionalisierte Materialien (Preisstufe „bulk“) stellen wir in größeren Mengen im Kilogrammmaßstab her. Welche Referenzmenge für Ihre Anwendung sinnvoll ist, klären wir gemeinsam.
  - label: Wie lange dauert die Bearbeitung meiner Bestellung?
    content: |
      Mustermengen aus unserem Standardprogramm versenden wir in der Regel innerhalb weniger Tage. Bei individuellen Spezifikationen oder größeren Produktionsmengen stimmen wir die Lieferzeit vorab mit Ihnen ab, sodass Sie planbar mit dem Material rechnen können.
