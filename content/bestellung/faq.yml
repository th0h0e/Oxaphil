title: Häufige Fragen zur Bestellung & Mustern
description: Antworten auf häufige Fragen rund um den Bestellprozess bei Oxaphil.
faqs:
  - label: Kann ich Muster fuer eigene Tests erhalten
    content: Ja. Seit 2025 liefern wir Proben an Kooperationspartner aus, die POx in realen Anwendungsszenarien erproben – den Anfang machte unser Partner DermaPurge. Wenn Sie POx in Ihrer eigenen Formulierung testen möchten, sprechen Sie uns an.
  - label: In welchen Mengen ist POx verfügbar?
    content: Unfunktionalisierte Typen liefern wir von 100 g bis 5 kg, funktionalisierte Typen von 100 mg bis 25 g. Größere Liefermengen stimmen wir individuell ab.
  - label: Wie kommt ein Angebot zustande?
    content: Über den Anfragen-Button neben jedem Produkt – darin sind Artikelnummer, Molmasse und Endgruppe bereits eingetragen. Wir klären Menge, Spezifikation und Liefertermin dann individuell mit Ihnen.
  - label: Beraten Sie auch bei der Formulierung?
    content: Ja. Aus den Gesprächen auf Fachmessen wie der in-cosmetics Global und dem Drug Delivery & Formulation Summit wissen wir, wie unterschiedlich die Anforderungen an neue Materialien sind. Wir hören zu, verstehen Ihren Bedarf und entwickeln gemeinsam mit Ihnen eine passende Lösung.
