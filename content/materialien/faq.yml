title: Häufige Fragen zu den Materialien
description: Antworten auf häufige Fragen zu den POx-Materialien von Oxaphil.
faqs:
  - label: Was sind Poly(2-oxazolin)e (POx)?
    content: |
      POx sind eine Klasse synthetischer Polymere, die durch kationische ringöffnende Polymerisation von 2-Oxazolinen entstehen. Weil die Polymerisation lebend verläuft, lassen sich Kettenlänge und Endgruppen präzise steuern. Das Ergebnis ist keine einzelne Substanz, sondern eine modulare Materialplattform, die sich für sehr unterschiedliche Anforderungen maßschneidern lässt.
  - label: Was bedeutet die Preisstufe „func“ bzw. „bulk“?
    content: |
      „func“ steht für funktionalisierte Materialien, die in kleineren Staffelmengen (typischerweise ab 100 mg) geliefert werden. „bulk“ bezeichnet unfunktionalisierte Materialien, die wir in größeren Mengen im Kilogrammmaßstab herstellen. Die passende Preisstufe ergibt sich aus Ihrer Anwendung – wir beraten Sie gern dazu.
  - label: Warum gibt es POx als modulare Plattform?
    content: |
      Je nach Architektur und Endgruppe verändern sich Eigenschaften wie Löslichkeit, Abbaukinetik und Funktionalisierbarkeit. Statt nur eines Produkts stellen wir daher Serien mit definierten Kettenlängen und Funktionalitäten bereit, sodass Sie genau das Material wählen können, das zu Ihrer Formulierung passt.
