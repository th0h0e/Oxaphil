title: Häufige Fragen zu Technologie & Material
description: Antworten auf häufige Fragen zu den POx-Materialien von Oxaphil.
faqs:
  - label: Was sind Poly(2-oxazolin)e (POx)?
    content: |
      POx sind eine Klasse synthetischer Polymere, die durch kationische ringöffnende Polymerisation von 2-Oxazolinen entstehen. Weil die Polymerisation lebend verläuft, lassen sich Kettenlänge und Endgruppen präzise steuern. Das Ergebnis ist keine einzelne Substanz, sondern eine modulare Materialplattform, die sich für sehr unterschiedliche Anforderungen maßschneidern lässt.
  - label: Worin liegt der Vorteil gegenüber PEG?
    content: PEG kann insbesondere im Zusammenhang mit Antikörpern und anderen Biologika unerwünschte Immunreaktionen auslösen. POx bietet eine bessere Biokompatibilität, eine größere Vielfalt an funktionellen Gruppen sowie eine verbesserte Löslichkeit.
  - label: Welche Analytik liefern Sie mit?
    content: Zu jeder Charge gehören GPC zur Bestimmung von Mn und Dispersität sowie 1H-NMR zur Bestätigung von Struktur und Endgruppe. Weitere Analytik stimmen wir projektbezogen ab.
  - label: Wie eng ist die Molmassenverteilung?
    content: Monofunktionelle Typen erreichen eine Dispersität von Đ ≤ 1,15, definierte kurze Ketten Đ ≤ 1,10. Telechelische, sternförmige und Blockstrukturen liegen je nach Architektur zwischen Đ ≤ 1,20 und ≤ 1,25.
