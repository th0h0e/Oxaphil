id: anwendungen
title: POx, Anwendungen als Materialien mit Wirkung
description: Nach der Übersicht über die chemischen Grundlagen und Eigenschaften folgt nun ein Blick auf konkrete Anwendungen der Materialien. Die besonderen Eigenschaften von POx entfalten ihre volle Relevanz erst in der praktischen Nutzung. Die Materialien verbinden funktionale Vielfalt mit hoher Biokompatibilität, Stabilität und Formulierungseffizienz. In der biomedizinischen Forschung sind sie längst als leistungsfähige Materialklasse etabliert. Mit Oxaphil können sie nun auch in der industriellen Entwicklung klare Vorteile bringen.
