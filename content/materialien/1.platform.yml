id: pox-als-plattform
title: POx, eine Plattform statt ein Ersatzstoff
description: Ein Blick in die Chemie von Poly(2-oxazolin)en (POx) offenbart eine bemerkenswerte Vielseitigkeit, die weit über die Eigenschaften herkömmlicher Polymere wie Polyethylenglykol (PEG) hinausgeht. POx werden durch lebende kationische Ringöffnungs-Polymerisation (LCROP) hergestellt, die eine präzise Kontrolle über Struktur, Kettenlänge und Funktionalität ermöglicht. Diese Synthesemethode erlaubt eine gezielte Variation der Seitenketten, wodurch sich die hydrophile-hydrophobe Balance (HLB), thermoresponsive Eigenschaften, biologische Wechselwirkungen sowie die physikalischen und chemischen Eigenschaften präzise abstimmen lassen. Ein weiterer Vorteil der POx liegt in der Möglichkeit, die Polymerketten gezielt an den Enden zu modifizieren. Diese Endgruppen-Funktionalisierung erlaubt die Anbindung von Wirkstoffen, Markern oder Vernetzern.
